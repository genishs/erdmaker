name: Bug report / 버그 신고
description: Report something that does not work as expected / 동작이 이상할 때 신고해 주세요
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public repository. Everyone can read what you post here.**
        Do NOT post database connection details, passwords, tokens, or any schema / ERD content you are not allowed to make public. To reproduce a problem, use a reduced, anonymized example.

        **이 레포는 공개 레포입니다. 올린 내용은 누구나 볼 수 있습니다.**
        DB 접속 정보, 비밀번호, 토큰, 공개하면 안 되는 스키마·ERD 내용은 올리지 마세요. 재현에는 축소·익명화한 예제를 사용해 주세요.
  - type: textarea
    id: description
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: Describe the problem. Screenshots are welcome. / 문제를 설명해 주세요. 스크린샷도 환영합니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 절차
      description: Numbered steps that trigger the problem. / 문제가 나타나는 순서를 번호로 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 기대한 결과
      description: What did you expect to happen? / 어떻게 동작하길 기대했나요?
  - type: textarea
    id: environment
    attributes:
      label: Environment / 환경 정보
      description: |
        Extension version, VS Code version, OS, language, target database, and so on. If you used "ERDmaker: Report Issue / Send Feedback" in VS Code (0.5.1 or later), this is filled in for you. Please check that it does not contain anything private.
        확장 버전, VS Code 버전, OS, 언어, 대상 DB 등. VS Code(0.5.1 이상)에서 "ERDmaker: Report Issue / Send Feedback" 명령으로 열었다면 자동으로 채워집니다. 비공개 정보가 없는지 확인해 주세요.
      placeholder: |
        ERDmaker:
        VS Code:
        OS:
  - type: textarea
    id: attachments
    attributes:
      label: Logs or minimal example / 로그 또는 축소 예제
      description: Paste relevant log output or a small anonymized example that reproduces the problem. / 관련 로그나, 문제를 재현하는 작은 익명화 예제를 붙여 넣어 주세요.
