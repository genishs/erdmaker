name: Feature request / 기능 요청
description: Suggest an idea or an improvement / 새 기능이나 개선 아이디어를 제안해 주세요
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public repository. Everyone can read what you post here.**
        Do NOT post database connection details, passwords, tokens, or any schema / ERD content you are not allowed to make public. Use reduced, anonymized examples.

        **이 레포는 공개 레포입니다. 올린 내용은 누구나 볼 수 있습니다.**
        DB 접속 정보, 비밀번호, 토큰, 공개하면 안 되는 스키마·ERD 내용은 올리지 마세요. 축소·익명화한 예제를 사용해 주세요.
  - type: textarea
    id: description
    attributes:
      label: What would you like? / 어떤 기능을 원하시나요?
      description: Describe the feature or improvement. / 원하는 기능이나 개선점을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case / 사용 상황
      description: What are you trying to do, and why does the current behavior fall short? / 무엇을 하려는 중이고, 지금 동작이 왜 부족한가요?
  - type: textarea
    id: environment
    attributes:
      label: Environment / 환경 정보
      description: |
        Extension version, VS Code version, OS, language, target database, and so on. If you used "ERDmaker: Report Issue / Send Feedback" in VS Code (0.5.1 or later), this is filled in for you. Please check that it does not contain anything private.
        확장 버전, VS Code 버전, OS, 언어, 대상 DB 등. VS Code(0.5.1 이상)에서 "ERDmaker: Report Issue / Send Feedback" 명령으로 열었다면 자동으로 채워집니다. 비공개 정보가 없는지 확인해 주세요.
